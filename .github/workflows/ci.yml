# EduWhiteboard CI — typecheck, test, build, and lint
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduwb
          POSTGRES_PASSWORD: eduwb
          POSTGRES_DB: eduwb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs
        env:
          DATABASE_URL: postgres://eduwb:eduwb@localhost:5432/eduwb

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck
        env:
          DATABASE_URL: postgres://eduwb:eduwb@localhost:5432/eduwb

      - name: Typecheck frontend
        run: pnpm --filter @workspace/edu-whiteboard run typecheck

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push-force
        env:
          DATABASE_URL: postgres://eduwb:eduwb@localhost:5432/eduwb

  docker:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t eduwb-api -f Dockerfile.api .

      - name: Build frontend image
        run: docker build -t eduwb-frontend -f Dockerfile.frontend .

  license-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses list > dependency-licenses.txt 2>/dev/null || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: dependency-licenses.txt
