# EduWhiteboard production deployment
# VPS-ready: PostgreSQL, Redis, MinIO, API, and Frontend
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# After first start:
#   docker compose exec api pnpm --filter @workspace/db run push-force

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - eduwb-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduwb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eduwb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduwb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduwb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - eduwb-redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eduwb

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    volumes:
      - eduwb-minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eduwb}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduwb

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-eduwb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eduwb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-eduwb}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      NODE_ENV: production
      PORT: ${API_PORT:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-5000}:${API_PORT:-5000}"
    networks:
      - eduwb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: ${FRONTEND_PORT:-5173}
      BASE_PATH: /
      API_URL: http://api:${API_PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    networks:
      - eduwb

volumes:
  eduwb-pgdata:
  eduwb-redis:
  eduwb-minio:

networks:
  eduwb:
    driver: bridge
